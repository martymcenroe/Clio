# THE TEST JOBS IN THIS FILE ARE OFF, by the operator's order of 2026-11-11 (#441): "shut it off fleet-wide. i simply
# do NOT understand why i ever did it. and even AZ. why take the extra time and tokens. somehow i think it got turned
# on and i had no idea why or how or when". Each one named below carries `if: false`, so GitHub starts no runner for
# it, bills nothing and reports it `skipped`; the tests run on the operator's machine before a branch lands. GitHub
# counts a skipped required check as passed, so branch protection is unchanged and a pull request still merges on
# pr-sentinel and Cerberus, which run apart from this file. Triggers, steps and every other job are kept as they were.
#
# Off: test.
#
# To turn one back on: delete its `if: false` line (where the line ends `# was: <condition>`, put that condition back
# as its `if:`), stage the file, and land it with AssemblyZero's tools/land_staged_workflow.py.

name: Tests

# 573 unit tests existed in this repo and none of them ran in CI (#366). The
# only workflow was Auto Review, which checks issue references -- so a PR that
# broke every test in the repo satisfied branch protection, and a test could sit
# failing in the index for two weeks without anything saying so. One did.
#
# Unit tests and lint only. `npm test` covers the jest suites; the four specs
# under tests/e2e/ and tests/viewer.e2e.test.js are Playwright, human-in-the-loop
# (page.pause(), headed Chrome, persistent login profiles) and cannot run on a
# runner. jest.config.js excludes them by the *.e2e.test.js suffix.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
